version: '3.8'
services:
  kafka:
    image: 'bitnami/kafka:latest'
    container_name: kafka-server
    ports:
      - '9092:9092'
      - '9094:9094'
    environment:
      # Node configuration
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker

      # Listener configuration
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT

      # Controller configuration (replaces ZooKeeper)
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER

      # Topic configuration
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka_data:/bitnami/kafka

  # Optional: Initialize with sample topics
  init-kafka:
    image: 'bitnami/kafka:latest'
    depends_on:
      - kafka
    entrypoint: [ '/bin/sh', '-c' ]
    command: |
      "
      # Wait for Kafka to be ready
      kafka-topics.sh --bootstrap-server kafka:9092 --list
      
      echo 'Creating sample topics...'
      kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic user-events --replication-factor 1 --partitions 3
      kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic order-events --replication-factor 1 --partitions 2
      
      echo 'Successfully created topics:'
      kafka-topics.sh --bootstrap-server kafka:9092 --list
      "

volumes:
  kafka_data:
    driver: local